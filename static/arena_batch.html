<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>批量对弈 — UniChess Arena</title>
<style>
  :root {
    --bg: #0e1116; --panel: #151922; --panel-2: #1a1f2b; --border: #232a38;
    --text: #d8dee8; --text-dim: #7a8299; --accent: #4d9fff; --accent-green: #34d399;
    --accent-red: #f87171; --accent-amber: #fbbf24;
    --board-light: #e8d5b5; --board-dark: #b58863; --board-sel: rgba(77,159,255,0.45);
    --board-last: rgba(251,191,36,0.45); --board-check: rgba(248,113,113,0.55);
    --eval-white: #f1f5f9; --eval-black: #1e293b; --eval-draw: #94a3b8;
    --sq-size: 42px;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: -apple-system, "Segoe UI", "PingFang SC", "Noto Sans SC", sans-serif;
         background: var(--bg); color: var(--text); min-height: 100vh; }
  .container { max-width: 1400px; margin: 0 auto; padding: 16px; }
  header { display: flex; align-items: center; justify-content: space-between; flex-wrap: wrap; gap: 10px; margin-bottom: 16px; }
  .brand { display: flex; align-items: center; gap: 10px; }
  .logo-icon svg { width: 26px; height: 26px; color: var(--accent); }
  .brand-title { font-size: 20px; font-weight: 700; letter-spacing: 0.5px; }
  .badge { font-size: 11px; background: var(--accent); color: #fff; padding: 2px 8px; border-radius: 999px; margin-left: 6px; vertical-align: middle; }
  .header-actions { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; }
  .nav-link { color: var(--text-dim); text-decoration: none; font-size: 13px; padding: 4px 8px; border-radius: 6px; border: 1px solid var(--border); }
  .nav-link:hover { color: var(--text); border-color: var(--accent); }
  .badge-models { display: flex; align-items: center; gap: 6px; font-size: 12px; color: var(--text-dim); }
  .badge-dot { width: 8px; height: 8px; border-radius: 50%; background: var(--text-dim); }
  .badge-dot.on { background: var(--accent-green); box-shadow: 0 0 6px var(--accent-green); }
  .badge-dot.off { background: var(--accent-red); }

  .batch-config-bar { display: flex; flex-wrap: wrap; gap: 10px; align-items: flex-end;
                       background: var(--panel); border: 1px solid var(--border); border-radius: 10px;
                       padding: 14px 16px; margin-bottom: 14px; }
  .control-group { display: flex; flex-direction: column; gap: 4px; }
  .control-group label { font-size: 11px; color: var(--text-dim); text-transform: uppercase; letter-spacing: 0.5px; }
  .control-group select, .control-group input { background: var(--panel-2); color: var(--text); border: 1px solid var(--border);
    border-radius: 6px; padding: 6px 8px; font-size: 13px; min-width: 120px; }
  .control-group input[type="number"] { min-width: 80px; }
  .btn-primary { background: var(--accent); color: #fff; border: none; padding: 8px 16px; border-radius: 8px; cursor: pointer; font-size: 13px; font-weight: 600; }
  .btn-primary:hover { filter: brightness(1.1); }
  .btn-primary:disabled { opacity: 0.5; cursor: not-allowed; }
  .validation-msg { color: var(--accent-red); font-size: 12px; margin-top: 4px; }

  .batch-summary { display: flex; flex-wrap: wrap; gap: 14px; align-items: center; padding: 10px 14px;
                   background: var(--panel); border: 1px solid var(--border); border-radius: 10px; margin-bottom: 14px; font-size: 13px; }
  .summary-pill { padding: 4px 10px; border-radius: 999px; font-weight: 600; font-size: 12px; }
  .pill-running { background: rgba(52,211,153,0.15); color: var(--accent-green); }
  .pill-completed { background: rgba(77,159,255,0.15); color: var(--accent); }
  .pill-error { background: rgba(248,113,113,0.15); color: var(--accent-red); }
  .pill-idle { background: rgba(122,130,153,0.15); color: var(--text-dim); }

  .batch-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 18px; margin-bottom: 18px; }
  @media (max-width: 1100px) { .batch-grid { grid-template-columns: 1fr; } }

  .worker-card { background: var(--panel); border: 1px solid var(--border); border-radius: 10px; padding: 12px; }
  .worker-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px; font-size: 12px; color: var(--text-dim); }
  .worker-header .w-title { font-weight: 700; color: var(--text); }
  .worker-header .w-meta { display: flex; gap: 8px; }
  .worker-board-wrap { display: flex; justify-content: center; margin: 6px 0; }
  .chessboard { display: grid; grid-template-columns: repeat(8, var(--sq-size)); grid-template-rows: repeat(8, var(--sq-size)); background: var(--board-dark); }
  .sq { position: relative; display: flex; align-items: center; justify-content: center; overflow: hidden; width: var(--sq-size); height: var(--sq-size); }
  .sq.l { background-color: var(--board-light); }
  .sq.d { background-color: var(--board-dark); }
  .sq.last { background-color: var(--board-last) !important; }
  .sq.check { background: var(--board-check) !important; }
  .sq .piece { width: 88%; height: 88%; position: relative; z-index: 2; pointer-events: none; }
  .sq .coord { position: absolute; font-size: 10px; font-weight: 700; pointer-events: none; z-index: 4; user-select: none; line-height: 1; opacity: 0.8; }
  .coord.f { right: 2px; bottom: 1px; }
  .coord.r { left: 2px; top: 1px; }
  .sq.l .coord { color: var(--board-dark); }
  .sq.d .coord { color: var(--board-light); }

  .worker-footer { display: flex; justify-content: space-between; font-size: 12px; color: var(--text-dim); margin-top: 6px; padding-top: 6px; border-top: 1px solid var(--border); }
  .worker-footer .wf-move { color: var(--accent-amber); font-weight: 600; }
  .worker-footer .wf-san { color: var(--text); }

  .records-section { background: var(--panel); border: 1px solid var(--border); border-radius: 10px; padding: 14px; }
  .records-header { font-size: 14px; font-weight: 700; margin-bottom: 10px; }
  .records-table { width: 100%; border-collapse: collapse; font-size: 12px; }
  .records-table th { text-align: left; padding: 6px 8px; border-bottom: 1px solid var(--border); color: var(--text-dim); font-weight: 600; }
  .records-table td { padding: 6px 8px; border-bottom: 1px solid var(--border); color: var(--text); }
  .badge-batch { font-size: 10px; background: rgba(77,159,255,0.15); color: var(--accent); padding: 2px 6px; border-radius: 4px; margin-left: 4px; }
  .empty-records { color: var(--text-dim); padding: 10px; }
  .a-link { color: var(--accent); text-decoration: none; }
  .a-link:hover { text-decoration: underline; }
</style>
</head>
<body>
<div class="container">
  <header>
    <div class="brand">
      <div class="logo-icon"><svg viewBox="0 0 24 24"><path d="M12 2L9.19 8.63L2 9.24L7.46 13.97L5.82 21L12 17.27L18.18 21L16.54 13.97L22 9.24L14.81 8.63L12 2Z"/></svg></div>
      <div class="brand-title">UniChess Arena <span class="badge">Batch</span></div>
    </div>
    <div class="header-actions">
      <a href="/arena" class="nav-link">← 单场竞技场</a>
      <a href="/" class="nav-link">人机对弈模式</a>
      <div class="badge-models"><span class="badge-dot" id="netinfo-dot"></span><span id="netinfo-text">服务连接中...</span></div>
    </div>
  </header>

  <div class="batch-config-bar">
    <div class="control-group"><label>模型 A</label><select id="white-model"></select></div>
    <div class="control-group"><label>模型 A 参数</label><select id="white-arg"></select></div>
    <div class="control-group"><label>模型 B</label><select id="black-model"></select></div>
    <div class="control-group"><label>模型 B 参数</label><select id="black-arg"></select></div>
    <div class="control-group"><label>轮数</label><input id="rounds" type="number" value="8" min="2" max="200" step="2"></div>
    <div class="control-group"><label>单局步数上限</label><input id="max-plies" type="number" value="400" min="50" max="2000"></div>
    <button class="btn-primary" id="btn-start">▶ 开始批量对弈</button>
  </div>

  <div class="batch-summary" id="batch-summary" style="display:none">
    <span class="summary-pill pill-idle" id="batch-status">空闲</span>
    <span id="batch-progress">0 / 0</span>
    <span id="batch-tally">白胜 0 · 黑胜 0 · 和棋 0</span>
  </div>

  <div class="batch-grid" id="batch-grid"></div>

  <div class="records-section">
    <div class="records-header">📋 本批次对局记录</div>
    <table class="records-table">
      <thead><tr><th>时间</th><th>白方</th><th>黑方</th><th>结果</th><th>步数</th></tr></thead>
      <tbody id="batch-records-tbody"><tr><td colspan="5" class="empty-records">等待批次启动...</td></tr></tbody>
    </table>
  </div>
</div>

function fenToBoard(fen) {
  const rows = fen.split(' ')[0].split('/');
  const b = {};
  rows.forEach((row, ri) => {
    let fi = 0;
    for (const ch of row) { if (/\d/.test(ch)) { fi += +ch; } else { b[FILES[fi] + (8 - ri)] = ch; fi++; } }
  });
  return b;
}
function turnFromFen(fen) { return fen.split(' ')[1] === 'w' ? 'white' : 'black'; }

function buildBoardCells(container) {
  const cells = [];
  for (let r = 8; r >= 1; r--) {
    for (let f = 0; f < 8; f++) {
      const el = document.createElement('div');
      const base = 'sq ' + (((f + r) % 2) ? 'l' : 'd');
      el.className = base;
      cells.push({ el, sq: FILES[f] + r, f, r, base });
    }
  }
  return cells;
}

function renderBoardInto(container, fen, lastMoveUci, inCheck) {
  if (!container._cells) container._cells = buildBoardCells(container);
  container.innerHTML = '';
  const pieces = fenToBoard(fen);
  const turn = turnFromFen(fen);
  let checkSq = null;
  if (inCheck) {
    const kc = turn === 'white' ? 'K' : 'k';
    for (const [sq, p] of Object.entries(pieces)) { if (p === kc) { checkSq = sq; break; } }
  }
  for (const { el, sq, f, r, base } of container._cells) {
    let cls = base;
    if (lastMoveUci && (lastMoveUci.slice(0,2) === sq || lastMoveUci.slice(2,4) === sq)) cls += ' last';
    if (sq === checkSq) cls += ' check';
    el.className = cls;
    el.textContent = '';
    const p = pieces[sq];
    if (p) {
      const svg = document.createElementNS('http://www.w3.org/2000/svg', 'svg');
      svg.setAttribute('class', 'piece'); svg.setAttribute('viewBox', '0 0 45 45');
      const use = document.createElementNS('http://www.w3.org/2000/svg', 'use');
      use.setAttributeNS('http://www.w3.org/1999/xlink', 'href', '#P-' + p);
      svg.appendChild(use); el.appendChild(svg);
    }
    if (r === 1) { const c = document.createElement('div'); c.className = 'coord f'; c.textContent = FILES[f]; el.appendChild(c); }
    if (f === 0) { const c = document.createElement('div'); c.className = 'coord r'; c.textContent = r; el.appendChild(c); }
    container.appendChild(el);
  }
}

async function api(path, method, body) {
  const opts = { method, headers: {'Content-Type': 'application/json'}, body: body ? JSON.stringify(body) : undefined };
  const r = await fetch(path, opts);
  if (!r.ok) {
    let msg = r.statusText;
    try { const d = (await r.json()).detail; if (d) msg = d; } catch(e) {}
    throw new Error(msg);
  }
  return r.json();
}

function setNetInfo(text, on) { $('netinfo-text').textContent = text; $('netinfo-dot').className = 'badge-dot ' + (on ? 'on' : 'off'); }

function populatePresets(prefix) {
  const sel = document.getElementById(prefix + '-model');
  const argSel = document.getElementById(prefix + '-arg');
  const name = sel.value;
  const info = (modelsData && modelsData[name]) || {};
  const presets = (info && info.presets) || [];
  argSel.innerHTML = presets.length ? presets.map(p => `<option value="${esc(p)}">${esc(p)}</option>`).join('') : '<option value="">（默认参数）</option>';
}

async function loadModels() {
  try {
    const resp = await api('/api/models', 'GET');
    modelsData = resp.models;
    const avail = Object.keys(modelsData).filter(n => modelsData[n] && modelsData[n].status === 'available');
    setNetInfo(avail.length ? `已连接 (${avail.join(', ')})` : '暂无可用模型', avail.length > 0);
    ['white', 'black'].forEach(prefix => {
      const sel = document.getElementById(prefix + '-model');
      sel.innerHTML = Object.keys(modelsData).map(n => {
        const ok = modelsData[n] && modelsData[n].status === 'available';
        return `<option value="${esc(n)}"${ok ? '' : ' disabled'}>${esc(n)}${ok ? '' : ' (未就绪)'}</option>`;
      }).join('');
      sel.onchange = () => populatePresets(prefix);
      populatePresets(prefix);
    });
  } catch(e) {
    setNetInfo('后端未就绪', false);
  }
}

async function startBatch() {
  if (currentBatchId) { alert('批量对弈已在运行中，页面将自动追踪。'); return; }
  const rounds = parseInt($('rounds').value || '8', 10);
  if (rounds % 2 !== 0) { alert('轮数必须为偶数'); return; }
  const body = {
    white_model: $('white-model').value, white_arg: $('white-arg').value || undefined,
    black_model: $('black-model').value, black_arg: $('black-arg').value || undefined,
    rounds: rounds, max_plies: parseInt($('max-plies').value || '400', 10),
  };
  if (!body.white_model || !body.black_model) { alert('请选择白方与黑方模型'); return; }
  try {
    const snap = await api('/api/arena/batch/start', 'POST', body);
    currentBatchId = snap.batch && snap.batch.id;
    $('btn-start').disabled = true;
    if (!pollTimer) pollState();
  } catch(e) { alert('启动失败：' + e.message); }
}

function renderSummary(batch) {
  const el = $('batch-summary');
  el.style.display = 'flex';
  const statusEl = $('batch-status');
  const progressEl = $('batch-progress');
  const tallyEl = $('batch-tally');
  if (!batch) { statusEl.textContent = '空闲'; statusEl.className = 'summary-pill pill-idle'; progressEl.textContent = '0 / 0'; tallyEl.textContent = '白胜 0 · 黑胜 0 · 和棋 0'; return; }
  const s = batch.status;
  statusEl.textContent = s === 'running' ? '对弈中' : s === 'completed' ? '已完成' : s === 'error' ? '异常' : s;
  statusEl.className = 'summary-pill ' + (s === 'running' ? 'pill-running' : s === 'completed' ? 'pill-completed' : s === 'error' ? 'pill-error' : 'pill-idle');
  progressEl.textContent = `${batch.rounds_completed} / ${batch.rounds_planned}`;
  const t = batch.tally || {};
  tallyEl.textContent = `白胜 ${t.white||0} · 黑胜 ${t.black||0} · 和棋 ${t.draw||0}`;
}

function renderWorkers(workers) {
  const grid = $('batch-grid');
  const COUNT = 4;
  while (grid.children.length < COUNT) {
    const card = document.createElement('div');
    card.className = 'worker-card';
    card.innerHTML = '<div class="worker-header"><span class="w-title">Worker --</span><span class="w-meta"><span class="w-round">-</span><span class="w-status">idle</span></span></div><div class="worker-board-wrap"><div class="chessboard batch-board"></div></div><div class="worker-footer"><span class="wf-move">-</span><span class="wf-san">-</span></div>';
    grid.appendChild(card);
  }
  const cards = grid.querySelectorAll('.worker-card');
  workers.forEach((w, i) => {
    if (i >= COUNT) return;
    const card = cards[i];
    card.querySelector('.w-title').textContent = `Worker ${w.index + 1}`;
    card.querySelector('.w-round').textContent = w.round_index != null ? `Round ${w.round_index + 1}` : '-';
    const statusEl = card.querySelector('.w-status');
    statusEl.textContent = w.status || 'idle';
    statusEl.style.color = w.status === 'playing' ? 'var(--accent-green)' : w.status === 'error' ? 'var(--accent-red)' : 'var(--text-dim)';
    const board = card.querySelector('.batch-board');
    const sanText = (w.san_history && w.san_history.length) ? w.san_history[w.san_history.length - 1] : '-';
    const moveText = w.last_move || '-';
    card.querySelector('.wf-move').textContent = moveText;
    card.querySelector('.wf-san').textContent = sanText;
    renderBoardInto(board, w.fen || '8/8/8/8/8/8/8/8 w - - 0 1', w.last_move, w.in_check);
  });
  for (let i = workers.length; i < COUNT; i++) {
    const card = cards[i];
    const board = card.querySelector('.batch-board');
    renderBoardInto(board, '8/8/8/8/8/8/8/8 w - - 0 1', null, false);
  }
}

async function pollState() {
  try {
    const snap = await api('/api/arena/batch/state', 'GET');
    const batch = snap.batch;
    if (batch && batch.id && batch.id !== currentBatchId) currentBatchId = batch.id;
    if (batch && batch.status === 'completed') { $('btn-start').disabled = false; }
    if (batch && batch.status === 'error') { $('btn-start').disabled = false; }
    renderSummary(batch);
    renderWorkers(snap.workers || []);
    await renderBatchRecords();
  } catch(e) {
    console.error('poll error', e);
  }
  pollTimer = setTimeout(pollState, 1000);
}

async function renderBatchRecords() {
  if (!currentBatchId) return;
  try {
    const resp = await api(`/api/arena/records?batch_id=${encodeURIComponent(currentBatchId)}&limit=50`, 'GET');
    const tbody = $('batch-records-tbody');
    const rows = resp.records || [];
    if (!rows.length) { tbody.innerHTML = '<tr><td colspan="5" class="empty-records">本批次暂无已完成对局</td></tr>'; return; }
    tbody.innerHTML = rows.map(r => {
      const time = r.end_time ? new Date(r.end_time).toLocaleString('zh-CN', { hour12: false }) : '-';
      let resultLabel = '-';
      if (r.result === '*') resultLabel = '未完成';
      else if (r.winner === 'white') resultLabel = (r.white_model || '白方') + ' 胜';
      else if (r.winner === 'black') resultLabel = (r.black_model || '黑方') + ' 胜';
      else if (r.winner === 'draw') resultLabel = '和棋';
      else if (r.winner === 'stopped') resultLabel = '已停止';
      else resultLabel = r.result || '-';
      return `<tr><td>${esc(time)}</td><td>${esc(r.white_model)}<small>(${esc(r.white_arg||'')})</small></td><td>${esc(r.black_model)}<small>(${esc(r.black_arg||'')})</small></td><td>${esc(resultLabel)}</td><td>${r.ply_count ?? '-'}</td></tr>`;
    }).join('');
  } catch(e) {
    // 静默忽略，不影响主界面
  }
}

$('btn-start').onclick = startBatch;
window.addEventListener('DOMContentLoaded', () => {
  document.body.insertAdjacentHTML('afterbegin', PIECE_DEFS);
  loadModels();
  pollState();
});
</script>
</body>
</html>
