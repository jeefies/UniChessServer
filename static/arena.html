<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>UniChess Arena - 竞技场对弈</title>
<style>
  :root {
    --bg-main: #0f1117;
    --bg-card: #181b24;
    --bg-card-subtle: #212634;
    --bg-card-hover: #292f40;
    --border-subtle: rgba(255, 255, 255, 0.08);
    --border-focus: #4f6bdf;
    
    --text-primary: #f0f3f8;
    --text-secondary: #9aa3b5;
    --text-muted: #5e6678;

    --board-light: #f0d9b5;
    --board-dark: #b58863;
    --board-sel: rgba(246, 214, 60, 0.65);
    --board-last: rgba(155, 199, 0, 0.42);
    --board-check: radial-gradient(ellipse at center, rgba(235, 60, 60, 0.9) 0%, rgba(200, 20, 20, 0.6) 45%, rgba(0,0,0,0) 75%);

    --accent-green: #22c55e;
    --accent-green-hover: #16a34a;
    --accent-blue: #3b82f6;
    --accent-amber: #f59e0b;
    --accent-red: #ef4444;
    --accent-purple: #8b5cf6;

    --eval-white: #ffffff;
    --eval-draw: #78716c;
    --eval-black: #1e212b;

    --sq-size: min(80px, calc((100vw - 48px - 36px) / 8));
  }

  @media (min-width: 900px) {
    :root {
      --sq-size: 72px;
    }
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    background-color: var(--bg-main);
    color: var(--text-primary);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 16px 12px;
  }

  .container {
    width: 100%;
    max-width: 1240px;
    display: flex;
    flex-direction: column;
    gap: 20px;
  }

  /* Header */
  header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 8px 4px;
    border-bottom: 1px solid var(--border-subtle);
    flex-wrap: wrap;
    gap: 12px;
  }
  .brand {
    display: flex;
    align-items: center;
    gap: 12px;
  }
  .logo-icon {
    width: 32px;
    height: 32px;
    background: linear-gradient(135deg, #ef4444, #f59e0b);
    border-radius: 8px;
    display: flex;
    align-items: center;
    justify-content: center;
    box-shadow: 0 4px 12px rgba(239, 68, 68, 0.3);
  }
  .logo-icon svg { width: 20px; height: 20px; fill: #fff; }
  .brand-title {
    font-size: 20px;
    font-weight: 700;
    letter-spacing: -0.5px;
    background: linear-gradient(to right, #ffffff, #fca5a5);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
  }
  .header-actions {
    display: flex;
    align-items: center;
    gap: 10px;
  }
  .nav-link {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    padding: 6px 12px;
    border-radius: 8px;
    background: var(--bg-card);
    border: 1px solid var(--border-subtle);
    color: var(--text-secondary);
    text-decoration: none;
    font-size: 12px;
    font-weight: 500;
    transition: all 0.2s ease;
  }
  .nav-link:hover {
    color: var(--text-primary);
    background: var(--bg-card-hover);
    border-color: rgba(255,255,255,0.2);
  }
  .badge-models {
    font-size: 12px;
    padding: 4px 10px;
    border-radius: 9999px;
    background: var(--bg-card);
    border: 1px solid var(--border-subtle);
    color: var(--text-secondary);
    display: flex;
    align-items: center;
    gap: 6px;
  }
  .badge-dot {
    width: 7px;
    height: 7px;
    border-radius: 50%;
    background: var(--accent-green);
    box-shadow: 0 0 8px var(--accent-green);
  }
  .badge-dot.offline {
    background: var(--accent-red);
    box-shadow: 0 0 8px var(--accent-red);
  }

  /* Main Workspace */
  .workspace {
    display: flex;
    flex-direction: column;
    gap: 24px;
    align-items: center;
  }

  @media (min-width: 1060px) {
    .workspace {
      flex-direction: row;
      align-items: flex-start;
      justify-content: center;
      gap: 28px;
    }
  }

  /* Board Area */
  .board-area {
    display: flex;
    flex-direction: column;
    gap: 12px;
    align-items: center;
  }

  .board-section {
    display: flex;
    gap: 14px;
    user-select: none;
    touch-action: manipulation;
  }

  .eval-gauge {
    width: 14px;
    height: calc(var(--sq-size) * 8);
    background: var(--eval-black);
    border-radius: 7px;
    overflow: hidden;
    position: relative;
    border: 1px solid var(--border-subtle);
    box-shadow: inset 0 2px 4px rgba(0,0,0,0.5);
    flex-shrink: 0;
  }
  .eval-fill-white {
    position: absolute;
    bottom: 0;
    left: 0;
    right: 0;
    background: var(--eval-white);
    transition: height 0.4s cubic-bezier(0.4, 0, 0.2, 1);
  }
  .eval-fill-draw {
    position: absolute;
    left: 0;
    right: 0;
    background: var(--eval-draw);
    opacity: 0.6;
    transition: bottom 0.4s ease, height 0.4s ease;
  }

  .board-container {
    position: relative;
    border-radius: 8px;
    box-shadow: 0 16px 36px -4px rgba(0, 0, 0, 0.6), 0 0 0 1px rgba(255,255,255,0.05);
    overflow: hidden;
  }

  .chessboard {
    display: grid;
    grid-template-columns: repeat(8, var(--sq-size));
    grid-template-rows: repeat(8, var(--sq-size));
    background: var(--board-dark);
  }

  .sq {
    position: relative;
    display: flex;
    align-items: center;
    justify-content: center;
    overflow: hidden;
  }
  .sq.l { background-color: var(--board-light); }
  .sq.d { background-color: var(--board-dark); }

  .sq.sel {
    background-color: var(--board-sel) !important;
  }
  .sq.last {
    background-color: var(--board-last) !important;
  }
  .sq.check {
    background: var(--board-check) !important;
  }

  .sq .piece {
    width: 88%;
    height: 88%;
    position: relative;
    z-index: 2;
    pointer-events: none;
    transition: transform 0.12s ease-out;
  }

  .coord {
    position: absolute;
    font-size: 11px;
    font-weight: 700;
    pointer-events: none;
    z-index: 4;
    user-select: none;
    line-height: 1;
    opacity: 0.8;
  }
  .coord.f { right: 4px; bottom: 3px; }
  .coord.r { left: 4px; top: 3px; }
  .sq.l .coord { color: var(--board-dark); }
  .sq.d .coord { color: var(--board-light); }

  /* Player Card */
  .player-card {
    width: calc(var(--sq-size) * 8 + 28px);
    display: flex;
    align-items: center;
    justify-content: space-between;
    background: var(--bg-card);
    border: 1px solid var(--border-subtle);
    border-radius: 10px;
    padding: 10px 14px;
    transition: all 0.25s ease;
  }
  .player-card.active-turn {
    border-color: var(--accent-amber);
    box-shadow: 0 0 16px rgba(245, 158, 11, 0.25);
    background: linear-gradient(90deg, rgba(245, 158, 11, 0.08), var(--bg-card));
  }
  .player-card.active-turn .player-indicator {
    background: var(--accent-amber);
    box-shadow: 0 0 10px var(--accent-amber);
    animation: pulse 1s infinite alternate;
  }
  .player-info {
    display: flex;
    align-items: center;
    gap: 10px;
  }
  .player-avatar {
    width: 32px;
    height: 32px;
    border-radius: 6px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-weight: 700;
    font-size: 14px;
  }
  .player-avatar.white-side {
    background: #e2e8f0;
    color: #0f172a;
    border: 1px solid #ffffff;
  }
  .player-avatar.black-side {
    background: #1e293b;
    color: #f8fafc;
    border: 1px solid #475569;
  }
  .player-details {
    display: flex;
    flex-direction: column;
    gap: 2px;
  }
  .player-name {
    font-size: 14px;
    font-weight: 600;
    color: var(--text-primary);
    display: flex;
    align-items: center;
    gap: 6px;
  }
  .player-preset-tag {
    font-size: 11px;
    padding: 1px 6px;
    border-radius: 4px;
    background: var(--bg-card-subtle);
    color: var(--text-secondary);
    border: 1px solid var(--border-subtle);
  }
  .player-stats {
    font-size: 11px;
    color: var(--text-muted);
  }
  .player-indicator {
    width: 8px;
    height: 8px;
    border-radius: 50%;
    background: var(--text-muted);
    transition: all 0.2s ease;
  }

  /* Control Panel */
  .panel {
    width: 100%;
    max-width: 460px;
    background: var(--bg-card);
    border: 1px solid var(--border-subtle);
    border-radius: 14px;
    padding: 20px;
    display: flex;
    flex-direction: column;
    gap: 16px;
    box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.4);
  }

  .panel-section-title {
    font-size: 12px;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 0.5px;
    color: var(--text-secondary);
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 2px;
  }

  .config-grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 12px;
    background: var(--bg-card-subtle);
    padding: 12px;
    border-radius: 10px;
    border: 1px solid var(--border-subtle);
  }
  .config-full {
    grid-column: 1 / -1;
  }

  .control-group {
    display: flex;
    flex-direction: column;
    gap: 6px;
  }
  .control-label {
    font-size: 11px;
    font-weight: 600;
    text-transform: uppercase;
    letter-spacing: 0.5px;
    color: var(--text-secondary);
  }

  select, input, button {
    font-family: inherit;
    font-size: 13px;
    outline: none;
    border-radius: 8px;
    border: 1px solid var(--border-subtle);
    background: var(--bg-card-subtle);
    color: var(--text-primary);
    transition: all 0.2s ease;
  }
  select {
    padding: 8px 10px;
    cursor: pointer;
    width: 100%;
  }
  select:hover:not(:disabled) {
    background: var(--bg-card-hover);
    border-color: rgba(255,255,255,0.15);
  }
  select:focus {
    border-color: var(--border-focus);
    box-shadow: 0 0 0 2px rgba(79, 107, 223, 0.25);
  }

  .action-buttons {
    display: flex;
    gap: 8px;
    flex-wrap: wrap;
  }
  button {
    padding: 9px 12px;
    font-weight: 600;
    cursor: pointer;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    gap: 6px;
  }
  button:hover:not(:disabled) {
    background: var(--bg-card-hover);
    border-color: rgba(255,255,255,0.2);
  }
  button:active:not(:disabled) {
    transform: scale(0.98);
  }
  button:disabled {
    opacity: 0.4;
    cursor: not-allowed;
  }

  button.btn-primary {
    background: linear-gradient(135deg, #2563eb, #3b82f6);
    border: 1px solid #60a5fa;
    color: #ffffff;
    box-shadow: 0 4px 14px rgba(37, 99, 235, 0.3);
    flex: 1.2;
  }
  button.btn-primary:hover:not(:disabled) {
    background: linear-gradient(135deg, #1d4ed8, #2563eb);
  }

  button.btn-success {
    background: linear-gradient(135deg, #15803d, #16a34a);
    border: 1px solid #22c55e;
    color: #ffffff;
  }
  button.btn-success:hover:not(:disabled) {
    background: linear-gradient(135deg, #16a34a, #22c55e);
  }

  button.btn-danger {
    background: linear-gradient(135deg, #b91c1c, #dc2626);
    border: 1px solid #ef4444;
    color: #ffffff;
  }
  button.btn-danger:hover:not(:disabled) {
    background: linear-gradient(135deg, #dc2626, #ef4444);
  }

  button.btn-secondary {
    flex: 1;
    background: var(--bg-card-subtle);
  }

  /* Status Card */
  .status-box {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 10px 14px;
    border-radius: 8px;
    background: var(--bg-card-subtle);
    border: 1px solid var(--border-subtle);
    min-height: 44px;
  }
  .status-indicator {
    width: 8px;
    height: 8px;
    border-radius: 50%;
    background: var(--accent-green);
    flex-shrink: 0;
  }
  .status-box.thinking .status-indicator {
    background: var(--accent-amber);
    box-shadow: 0 0 10px var(--accent-amber);
    animation: pulse 1s infinite alternate;
  }
  .status-box.gameover .status-indicator {
    background: var(--accent-purple);
  }
  .status-box.error .status-indicator {
    background: var(--accent-red);
    box-shadow: 0 0 8px var(--accent-red);
  }
  .status-text {
    font-size: 13px;
    line-height: 1.4;
    color: var(--text-primary);
  }
  .status-box.error .status-text {
    color: #fca5a5;
  }

  @keyframes pulse {
    0% { opacity: 0.4; transform: scale(0.9); }
    100% { opacity: 1; transform: scale(1.15); }
  }

  /* WDL Stats */
  .wdl-container {
    display: flex;
    flex-direction: column;
    gap: 6px;
    background: var(--bg-card-subtle);
    padding: 10px 12px;
    border-radius: 8px;
    border: 1px solid var(--border-subtle);
  }
  .wdl-bar {
    display: flex;
    height: 8px;
    border-radius: 4px;
    overflow: hidden;
    background: #0f1117;
  }
  .wdl-bar-item {
    height: 100%;
    transition: width 0.3s ease;
  }
  .wdl-bar-w { background: var(--eval-white); }
  .wdl-bar-d { background: var(--eval-draw); }
  .wdl-bar-l { background: var(--eval-black); border-right: 1px solid var(--border-subtle); }

  .wdl-labels {
    display: flex;
    justify-content: space-between;
    font-size: 11px;
    font-weight: 500;
    color: var(--text-secondary);
  }

  /* Metadata Details */
  .meta-grid {
    display: grid;
    grid-template-columns: repeat(2, 1fr);
    gap: 8px;
    background: var(--bg-card-subtle);
    padding: 10px 12px;
    border-radius: 8px;
    border: 1px solid var(--border-subtle);
    font-size: 12px;
  }
  .meta-item {
    display: flex;
    justify-content: space-between;
    color: var(--text-muted);
  }
  .meta-val {
    color: var(--text-primary);
    font-weight: 500;
  }

  /* Move History Table */
  .history-box {
    display: flex;
    flex-direction: column;
    height: 160px;
    background: var(--bg-card-subtle);
    border-radius: 8px;
    border: 1px solid var(--border-subtle);
    overflow: hidden;
  }
  .history-header {
    padding: 6px 12px;
    font-size: 11px;
    font-weight: 600;
    text-transform: uppercase;
    color: var(--text-secondary);
    background: rgba(0,0,0,0.15);
    border-bottom: 1px solid var(--border-subtle);
  }
  .history-list {
    flex: 1;
    overflow-y: auto;
    padding: 6px 8px;
    font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
    font-size: 12px;
    display: flex;
    flex-direction: column;
    gap: 2px;
  }
  .history-row {
    display: grid;
    grid-template-columns: 36px 1fr 1fr;
    padding: 2px 4px;
    border-radius: 4px;
  }
  .history-row:hover {
    background: rgba(255,255,255,0.03);
  }
  .history-num { color: var(--text-muted); }
  .history-move { color: var(--text-primary); }
  .history-move.active {
    color: var(--accent-amber);
    font-weight: 700;
  }

  /* Replay Control Bar */
  .replay-bar {
    display: none;
    flex-direction: column;
    gap: 8px;
    background: rgba(139, 92, 246, 0.1);
    border: 1px solid rgba(139, 92, 246, 0.3);
    border-radius: 10px;
    padding: 10px 14px;
  }
  .replay-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    font-size: 12px;
    color: #c4b5fd;
    font-weight: 600;
  }
  .replay-actions {
    display: flex;
    gap: 6px;
  }

  /* Records Section */
  .records-section {
    background: var(--bg-card);
    border: 1px solid var(--border-subtle);
    border-radius: 14px;
    padding: 18px 20px;
    display: flex;
    flex-direction: column;
    gap: 14px;
  }
  .records-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
  }
  .records-title {
    font-size: 16px;
    font-weight: 700;
    color: var(--text-primary);
    display: flex;
    align-items: center;
    gap: 8px;
  }
  .table-responsive {
    overflow-x: auto;
  }
  table.records-table {
    width: 100%;
    border-collapse: collapse;
    font-size: 13px;
    text-align: left;
  }
  table.records-table th {
    padding: 10px 12px;
    color: var(--text-secondary);
    font-weight: 600;
    border-bottom: 1px solid var(--border-subtle);
    background: var(--bg-card-subtle);
  }
  table.records-table td {
    padding: 10px 12px;
    border-bottom: 1px solid var(--border-subtle);
    color: var(--text-primary);
  }
  table.records-table tr:hover td {
    background: rgba(255,255,255,0.02);
  }
  .badge-result {
    display: inline-block;
    padding: 2px 8px;
    border-radius: 9999px;
    font-size: 11px;
    font-weight: 600;
  }
  .badge-white-win { background: rgba(34, 197, 94, 0.2); color: #4ade80; border: 1px solid rgba(34, 197, 94, 0.4); }
  .badge-black-win { background: rgba(59, 130, 246, 0.2); color: #60a5fa; border: 1px solid rgba(59, 130, 246, 0.4); }
  .badge-draw { background: rgba(148, 163, 184, 0.2); color: #cbd5e1; border: 1px solid rgba(148, 163, 184, 0.4); }
  .badge-stopped { background: rgba(239, 68, 68, 0.2); color: #f87171; border: 1px solid rgba(239, 68, 68, 0.4); }

  .empty-records {
    text-align: center;
    color: var(--text-muted);
    padding: 30px;
    font-size: 13px;
  }
</style>
</head>

<script>
const FILES = 'abcdefgh';
const START_FEN = 'rnbqkbnr/pppppppp/8/8/8/8/PPPPPPPP/RNBQKBNR w KQkq - 0 1';

const $ = id => document.getElementById(id);
const esc = v => String(v == null ? '' : v).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

let modelsData = null;
let currentArenaId = null;
let currentArenaState = null;
let autoPlayTimer = null;
let isStepping = false;

// Board rendering state
let currentFen = START_FEN;
let boardCells = null;
let lastMoveUci = null;
let checkSq = null;

// Replay mode state
let replayActive = false;
let replayHistory = []; // list of { fen, san, uci }
let replayIndex = 0;
let cachedRecords = [];

// --- API Client ---
async function api(path, method = 'GET', body = undefined) {
  const opts = {
    method,
    headers: {'Content-Type': 'application/json'},
    body: body ? JSON.stringify(body) : undefined
  };
  const r = await fetch(path, opts);
  if (!r.ok) {
    let msg = r.statusText;
    try {
      const d = (await r.json()).detail;
      if (Array.isArray(d) && d.length) {
        msg = d.map(e => (e.loc ? e.loc.join('.') + ': ' : '') + (e.msg || '')).join('; ');
      } else if (d) {
        msg = d;
      }
    } catch(e) {}
    throw new Error(msg);
  }
  return r.json();
}

// --- FEN & Board Logic ---
function fenToBoard(fen) {
  const rows = fen.split(' ')[0].split('/');
  const b = {};
  rows.forEach((row, ri) => {
    let fi = 0;
    for (const ch of row) {
      if (/\d/.test(ch)) { fi += +ch; }
      else { b[FILES[fi] + (8 - ri)] = ch; fi++; }
    }
  });
  return b;
}

function turnFromFen(fen) {
  return fen.split(' ')[1] === 'w' ? 'white' : 'black';
}

function buildBoard() {
  const board = $('board');
  board.innerHTML = '';
  boardCells = [];
  const ranks = [8,7,6,5,4,3,2,1];
  const files = [0,1,2,3,4,5,6,7];
  for (const r of ranks) {
    for (const f of files) {
      const el = document.createElement('div');
      const base = 'sq ' + (((f + r) % 2) ? 'l' : 'd');
      el.className = base;
      const sq = FILES[f] + r;
      board.appendChild(el);
      boardCells.push({el, sq, f, r, base});
    }
  }
}

function renderBoard(fen, lastMove = null) {
  if (!boardCells) buildBoard();
  const pieces = fenToBoard(fen);

  // Check square
  let checkSquare = null;
  const turn = turnFromFen(fen);
  // Simple check detection: if king has check state recorded
  if (currentArenaState && currentArenaState.in_check) {
    const kc = turn === 'white' ? 'K' : 'k';
    for (const [sq, p] of Object.entries(pieces)) {
      if (p === kc) checkSquare = sq;
    }
  }

  for (const {el, sq, f, r, base} of boardCells) {
    let cls = base;
    if (lastMove && (lastMove.slice(0, 2) === sq || lastMove.slice(2, 4) === sq)) {
      cls += ' last';
    }
    if (sq === checkSquare) {
      cls += ' check';
    }
    el.className = cls;
    el.textContent = '';

    const p = pieces[sq];
    if (p) {
      const svg = document.createElementNS('http://www.w3.org/2000/svg', 'svg');
      svg.setAttribute('class', 'piece');
      svg.setAttribute('viewBox', '0 0 45 45');
      const use = document.createElementNS('http://www.w3.org/2000/svg', 'use');
      use.setAttributeNS('http://www.w3.org/1999/xlink', 'href', '#P-' + p);
      svg.appendChild(use);
      el.appendChild(svg);
    }

    if (r === 1) {
      const c = document.createElement('div'); c.className = 'coord f'; c.textContent = FILES[f];
      el.appendChild(c);
    }
    if (f === 0) {
      const c = document.createElement('div'); c.className = 'coord r'; c.textContent = r;
      el.appendChild(c);
    }
  }
}

// Lightweight UCI move applier for pure client-side replay & SAN generation
function applyUciToBoard(b, uci) {
  const fromSq = uci.slice(0, 2);
  const toSq = uci.slice(2, 4);
  const promo = uci.length > 4 ? uci[4] : null;
  const movingPiece = b[fromSq];
  if (!movingPiece) return;

  delete b[fromSq];
  if (promo) {
    b[toSq] = (movingPiece === movingPiece.toUpperCase()) ? promo.toUpperCase() : promo.toLowerCase();
  } else {
    // Castling
    if (movingPiece === 'K' && fromSq === 'e1') {
      if (toSq === 'g1') { delete b['h1']; b['f1'] = 'R'; }
      else if (toSq === 'c1') { delete b['a1']; b['d1'] = 'R'; }
    } else if (movingPiece === 'k' && fromSq === 'e8') {
      if (toSq === 'g8') { delete b['h8']; b['f8'] = 'r'; }
      else if (toSq === 'c8') { delete b['a8']; b['d8'] = 'r'; }
    }
    // En passant
    if (movingPiece.toLowerCase() === 'p' && fromSq[0] !== toSq[0] && !b[toSq]) {
      const epSq = toSq[0] + fromSq[1];
      delete b[epSq];
    }
    b[toSq] = movingPiece;
  }
}

function boardToFen(b, nextTurn) {
  const newRows = [];
  for (let r = 8; r >= 1; r--) {
    let empty = 0;
    let rowStr = '';
    for (let f = 0; f < 8; f++) {
      const sq = FILES[f] + r;
      const p = b[sq];
      if (p) {
        if (empty > 0) { rowStr += empty; empty = 0; }
        rowStr += p;
      } else {
        empty++;
      }
    }
    if (empty > 0) rowStr += empty;
    newRows.push(rowStr);
  }
  return `${newRows.join('/')} ${nextTurn} - - 0 1`;
}

// Compute SAN from UCI and board state
function uciToSan(b, uci) {
  const fromSq = uci.slice(0, 2);
  const toSq = uci.slice(2, 4);
  const promo = uci.length > 4 ? uci[4] : '';
  const p = b[fromSq];
  if (!p) return uci;

  const type = p.toUpperCase();
  // Castling
  if (type === 'K') {
    if ((fromSq === 'e1' && toSq === 'g1') || (fromSq === 'e8' && toSq === 'g8')) return 'O-O';
    if ((fromSq === 'e1' && toSq === 'c1') || (fromSq === 'e8' && toSq === 'c8')) return 'O-O-O';
  }

  const isCapture = !!b[toSq] || (type === 'P' && fromSq[0] !== toSq[0]);
  if (type === 'P') {
    let san = '';
    if (isCapture) {
      san = fromSq[0] + 'x' + toSq;
    } else {
      san = toSq;
    }
    if (promo) san += '=' + promo.toUpperCase();
    return san;
  }

  const pieceLetter = type;
  return pieceLetter + (isCapture ? 'x' : '') + toSq + (promo ? '=' + promo.toUpperCase() : '');
}

// Build replay sequence from UCI string
function parseMovesSequence(movesStr) {
  const ucis = (movesStr || '').trim().split(/\s+/).filter(Boolean);
  const steps = [{ fen: START_FEN, san: null, uci: null }];
  const currentPieces = fenToBoard(START_FEN);
  let currentTurn = 'w';

  for (const uci of ucis) {
    const san = uciToSan(currentPieces, uci);
    applyUciToBoard(currentPieces, uci);
    currentTurn = currentTurn === 'w' ? 'b' : 'w';
    const nextFen = boardToFen(currentPieces, currentTurn);
    steps.push({ fen: nextFen, san, uci });
  }
  return steps;
}

// --- Status & UI Update Helpers ---
function setStatus(text, type = '') {
  const card = $('status-card');
  const label = $('status');
  label.textContent = text;
  card.className = 'status-box' + (type ? ' ' + type : '');
}

function updateEvalBar(evalObj) {
  if (evalObj && typeof evalObj.win === 'number') {
    const w = evalObj.win, d = evalObj.draw, l = evalObj.loss;
    $('wdl-box').style.display = 'flex';
    $('wdlw').style.width = (w * 100) + '%';
    $('wdld').style.width = (d * 100) + '%';
    $('wdll').style.width = (l * 100) + '%';
    $('wdlnum').innerHTML = `<span>白胜 ${(w * 100).toFixed(0)}%</span><span>和局 ${(d * 100).toFixed(0)}%</span><span>黑胜 ${(l * 100).toFixed(0)}%</span>`;

    const score = w + d / 2;
    $('evalfill').style.height = (score * 100) + '%';
    $('evaldraw').style.bottom = (w * 100) + '%';
    $('evaldraw').style.height = (d * 100) + '%';
  } else if (evalObj && typeof evalObj === 'number') {
    // Scalar eval (-1 to 1 or win probability)
    let score = 0.5;
    if (evalObj >= -1 && evalObj <= 1) {
      score = (evalObj + 1) / 2;
    } else if (evalObj >= 0 && evalObj <= 1) {
      score = evalObj;
    }
    $('wdl-box').style.display = 'none';
    $('evalfill').style.height = (score * 100) + '%';
    $('evaldraw').style.height = '0%';
  } else {
    $('wdl-box').style.display = 'none';
    $('evalfill').style.height = '50%';
    $('evaldraw').style.height = '0%';
  }
}

function updatePlayersDisplay(state, lastStep) {
  const wName = state.white_model || '白方';
  const wArg = state.white_arg ? `preset: ${state.white_arg}` : 'default';
  const bName = state.black_model || '黑方';
  const bArg = state.black_arg ? `preset: ${state.black_arg}` : 'default';

  $('card-white-name').textContent = wName;
  $('card-white-arg').textContent = wArg;
  $('card-black-name').textContent = bName;
  $('card-black-arg').textContent = bArg;

  const turn = state.turn || turnFromFen(state.fen || START_FEN);
  const isOver = state.is_game_over;

  const cardW = $('card-white');
  const cardB = $('card-black');

  if (isOver) {
    cardW.classList.remove('active-turn');
    cardB.classList.remove('active-turn');
  } else {
    if (turn === 'white') {
      cardW.classList.add('active-turn');
      cardB.classList.remove('active-turn');
    } else {
      cardB.classList.add('active-turn');
      cardW.classList.remove('active-turn');
    }
  }

  // Last thinking info
  if (lastStep && lastStep.engine_ms != null) {
    const timeMs = lastStep.engine_ms;
    const san = lastStep.san || lastStep.move || '-';
    if (lastStep.turn === 'white') {
      // White made the move
      $('card-white-stats').textContent = `耗时: ${timeMs}ms | 着法: ${san}`;
    } else {
      $('card-black-stats').textContent = `耗时: ${timeMs}ms | 着法: ${san}`;
    }
    $('meta-last-time').textContent = `${timeMs} ms`;
  }
}

function renderHistoryTable(sanList, activeIndex = -1) {
  const mvEl = $('moves');
  if (!sanList || sanList.length === 0) {
    mvEl.innerHTML = '<div style="color:var(--text-muted);padding:8px 4px;">尚无对局着法</div>';
    return;
  }

  let html = '';
  for (let i = 0; i < sanList.length; i += 2) {
    const round = Math.floor(i / 2) + 1;
    const wActive = (activeIndex === i + 1) ? ' active' : '';
    const bActive = (activeIndex === i + 2) ? ' active' : '';
    const w = esc(sanList[i] || '');
    const b = esc(sanList[i + 1] || '');
    html += `<div class="history-row"><span class="history-num">${round}.</span><span class="history-move${wActive}" data-idx="${i + 1}">${w}</span><span class="history-move${bActive}" data-idx="${i + 2}">${b}</span></div>`;
  }
  mvEl.innerHTML = html;

  if (activeIndex < 0) {
    mvEl.scrollTop = mvEl.scrollHeight;
  } else {
    const activeEl = mvEl.querySelector('.history-move.active');
    if (activeEl) activeEl.scrollIntoView({ block: 'nearest' });
  }
}

// --- Models & Presets Setup ---
function populatePresets(prefix, modelName) {
  const selPreset = $(`${prefix}-preset-select`);
  const info = (modelsData && modelsData[modelName]) || null;
  const presets = (info && info.presets) || [];
  if (presets.length > 0) {
    selPreset.innerHTML = presets.map(p => `<option value="${esc(p)}">${esc(p)}</option>`).join('');
  } else {
    selPreset.innerHTML = '<option value="">（默认参数）</option>';
  }
}

function onModelChanged(prefix) {
  const modelName = $(`${prefix}-model-select`).value;
  populatePresets(prefix, modelName);
}

$('white-model-select').onchange = () => onModelChanged('white');
$('black-model-select').onchange = () => onModelChanged('black');

$('btn-swap-sides').onclick = () => {
  const wModel = $('white-model-select').value;
  const wPreset = $('white-preset-select').value;
  const bModel = $('black-model-select').value;
  const bPreset = $('black-preset-select').value;

  $('white-model-select').value = bModel;
  populatePresets('white', bModel);
  $('white-preset-select').value = bPreset;

  $('black-model-select').value = wModel;
  populatePresets('black', wModel);
  $('black-preset-select').value = wPreset;
};

async function loadModels() {
  try {
    const res = await api('/api/models');
    modelsData = res.models || {};
    const names = Object.keys(modelsData);
    const avail = names.filter(n => modelsData[n] && modelsData[n].status === 'available');

    $('netinfo-text').textContent = avail.length ? `已连接 (${avail.join(', ')})` : '暂无可用模型';
    $('netinfo-dot').className = avail.length ? 'badge-dot' : 'badge-dot offline';

    const optsHtml = names.length
      ? names.map(n => {
          const info = modelsData[n] || {};
          const ok = info.status === 'available';
          const label = ok ? esc(n) : `${esc(n)} (未就绪)`;
          return `<option value="${esc(n)}"${ok ? '' : ' disabled'}>${label}</option>`;
        }).join('')
      : '<option value="">无可用模型</option>';

    $('white-model-select').innerHTML = optsHtml;
    $('black-model-select').innerHTML = optsHtml;

    // Prefer distinct models if both available (e.g. T vs R)
    if (names.includes('T')) $('white-model-select').value = 'T';
    if (names.includes('R')) $('black-model-select').value = 'R';

    onModelChanged('white');
    onModelChanged('black');
  } catch (err) {
    $('netinfo-text').textContent = '服务离线或异常';
    $('netinfo-dot').className = 'badge-dot offline';
    setStatus('拉取对弈引擎失败: ' + err.message, 'error');
  }
}

// --- Live Match Control ---
$('btn-start-match').onclick = async () => {
  if (autoPlayTimer) clearInterval(autoPlayTimer);
  autoPlayTimer = null;

  const white_model = $('white-model-select').value;
  const white_arg = $('white-preset-select').value || null;
  const black_model = $('black-model-select').value;
  const black_arg = $('black-preset-select').value || null;

  if (!white_model || !black_model) {
    setStatus('请选择白方和黑方模型！', 'error');
    return;
  }

  // If replay was active, exit replay first
  if (replayActive) exitReplayMode();

  setStatus('正在初始化竞技场双引擎...', 'thinking');
  $('btn-start-match').disabled = true;

  try {
    const res = await api('/api/arena/new', 'POST', {
      white_model,
      white_arg,
      black_model,
      black_arg
    });

    currentArenaId = res.arena_id;
    currentArenaState = res.state;
    currentFen = res.state.fen;
    lastMoveUci = null;

    renderBoard(currentFen, null);
    updatePlayersDisplay(currentArenaState, null);
    updateEvalBar(null);

    // Parse moves
    const steps = parseMovesSequence(currentArenaState.moves || '');
    const sanList = steps.slice(1).map(s => s.san);
    renderHistoryTable(sanList);

    $('meta-turn').textContent = currentArenaState.turn === 'white' ? '白方执子' : '黑方执子';
    $('meta-moves').textContent = '0 步';
    $('meta-game-state').textContent = '进行中';
    $('meta-last-time').textContent = '-';

    $('btn-play-pause').disabled = false;
    $('btn-step').disabled = false;
    $('btn-stop').disabled = false;
    setPlayState(false);

    setStatus(`对局已建立 (ID: ${currentArenaId.slice(0, 8)}...)。点击「单步落子」或「自动对弈」开始博弈！`);
  } catch (err) {
    setStatus('创建竞技场对局失败: ' + err.message, 'error');
  } finally {
    $('btn-start-match').disabled = false;
  }
};

async function executeStep() {
  if (!currentArenaId || isStepping) return;
  isStepping = true;

  const currentTurn = currentArenaState ? currentArenaState.turn : 'white';
  setStatus(`AI 正在思考 (${currentTurn === 'white' ? '白方' : '黑方'})...`, 'thinking');

  try {
    const res = await api(`/api/arena/games/${currentArenaId}/step`, 'POST');
    currentArenaState = res.state;
    const step = res.step;

    if (step && step.move) {
      lastMoveUci = step.move;
      currentFen = res.state.fen;
      renderBoard(currentFen, lastMoveUci);
      updateEvalBar(step.eval);

      // In step response, step.turn is the side that just moved
      updatePlayersDisplay(res.state, {
        engine_ms: step.engine_ms,
        san: step.san,
        move: step.move,
        turn: step.turn
      });

      // Update history
      const steps = parseMovesSequence(res.state.moves || '');
      const sanList = steps.slice(1).map(s => s.san);
      renderHistoryTable(sanList);

      $('meta-turn').textContent = res.state.turn === 'white' ? '白方执子' : '黑方执子';
      $('meta-moves').textContent = `${res.state.ply_count} 步`;
    }

    if (res.state.is_game_over) {
      handleGameOver(res.state);
    } else {
      setStatus(`走法已推入: ${step.san || step.move} (${step.engine_ms} ms)。`);
    }
  } catch (err) {
    // Pause on error
    if (autoPlayTimer) pauseAutoPlay();
    setStatus('单步执行失败: ' + err.message, 'error');
  } finally {
    isStepping = false;
  }
}

function handleGameOver(state) {
  if (autoPlayTimer) pauseAutoPlay();
  $('btn-play-pause').disabled = true;
  $('btn-step').disabled = true;
  $('btn-stop').disabled = true;

  let outcomeText = '对局结束';
  if (state.winner === 'white') outcomeText = '🏆 白方胜出 (1-0)';
  else if (state.winner === 'black') outcomeText = '🏆 黑方胜出 (0-1)';
  else if (state.winner === 'draw') outcomeText = '🤝 双方和棋 (1/2-1/2)';
  else if (state.winner === 'stopped') outcomeText = '⏹ 对局已终止';

  const reason = state.termination_reason ? ` (${state.termination_reason})` : '';
  $('meta-game-state').textContent = outcomeText + reason;
  setStatus(`终局: ${outcomeText}${reason}，记录已自动保存到历史库中。`, 'gameover');

  // Refresh records table
  loadRecords();
}

$('btn-step').onclick = () => {
  executeStep();
};

function setPlayState(playing) {
  if (playing) {
    $('play-icon').textContent = '⏸';
    $('play-text').textContent = '暂停对弈';
    $('btn-play-pause').className = 'btn-secondary';
  } else {
    $('play-icon').textContent = '▶';
    $('play-text').textContent = '自动对弈';
    $('btn-play-pause').className = 'btn-success';
  }
}

function startAutoPlay() {
  if (autoPlayTimer) clearInterval(autoPlayTimer);
  const interval = parseInt($('speed-select').value, 10) || 1200;
  setPlayState(true);
  executeStep();
  autoPlayTimer = setInterval(() => {
    if (!isStepping && currentArenaState && !currentArenaState.is_game_over) {
      executeStep();
    }
  }, interval);
}

function pauseAutoPlay() {
  if (autoPlayTimer) clearInterval(autoPlayTimer);
  autoPlayTimer = null;
  setPlayState(false);
}

$('btn-play-pause').onclick = () => {
  if (autoPlayTimer) {
    pauseAutoPlay();
  } else {
    startAutoPlay();
  }
};

$('speed-select').onchange = () => {
  if (autoPlayTimer) {
    pauseAutoPlay();
    startAutoPlay();
  }
};

$('btn-stop').onclick = async () => {
  if (!currentArenaId) return;
  if (!confirm('确定要终止当前竞技场对局吗？')) return;

  if (autoPlayTimer) pauseAutoPlay();

  setStatus('正在终止对局并保存记录...', 'thinking');
  try {
    await api(`/api/arena/games/${currentArenaId}`, 'DELETE');
    $('meta-game-state').textContent = '已手动终止';
    setStatus('对局已手动终止，对战走法已归档。');
    $('btn-play-pause').disabled = true;
    $('btn-step').disabled = true;
    $('btn-stop').disabled = true;
    loadRecords();
  } catch (err) {
    setStatus('终止对局失败: ' + err.message, 'error');
  }
};

// --- Replay Mode ---
function enterReplayMode(record) {
  if (autoPlayTimer) pauseAutoPlay();

  replayActive = true;
  replayHistory = parseMovesSequence(record.moves || '');
  replayIndex = 0;

  $('replay-bar').style.display = 'flex';
  $('setup-panel').style.opacity = '0.5';
  $('setup-panel').style.pointerEvents = 'none';

  $('btn-play-pause').disabled = true;
  $('btn-step').disabled = true;
  $('btn-stop').disabled = true;

  // Set card info
  $('card-white-name').textContent = record.white_model;
  $('card-white-arg').textContent = record.white_arg ? `preset: ${record.white_arg}` : 'default';
  $('card-black-name').textContent = record.black_model;
  $('card-black-arg').textContent = record.black_arg ? `preset: ${record.black_arg}` : 'default';
  $('card-white-stats').textContent = `对局结果: ${record.result}`;
  $('card-black-stats').textContent = `共 ${record.ply_count} 步`;

  $('card-white').classList.remove('active-turn');
  $('card-black').classList.remove('active-turn');

  const sanList = replayHistory.slice(1).map(s => s.san);
  renderHistoryTable(sanList, 0);

  updateReplayView();
  setStatus(`正在复盘对战记录 [${record.id.slice(0, 8)}]：使用 [上一步] [下一步] 回放！`);
}

function exitReplayMode() {
  replayActive = false;
  replayHistory = [];
  replayIndex = 0;

  $('replay-bar').style.display = 'none';
  $('setup-panel').style.opacity = '1';
  $('setup-panel').style.pointerEvents = 'auto';

  // Restore current arena view or default
  if (currentArenaState) {
    currentFen = currentArenaState.fen;
    renderBoard(currentFen, lastMoveUci);
    updatePlayersDisplay(currentArenaState, null);
    const steps = parseMovesSequence(currentArenaState.moves || '');
    renderHistoryTable(steps.slice(1).map(s => s.san));
    if (!currentArenaState.is_game_over) {
      $('btn-play-pause').disabled = false;
      $('btn-step').disabled = false;
      $('btn-stop').disabled = false;
    }
    setStatus('已退出复盘，返回实时竞技场。');
  } else {
    currentFen = START_FEN;
    renderBoard(currentFen, null);
    renderHistoryTable([]);
    setStatus('已退出复盘模式。');
  }
}

function updateReplayView() {
  const step = replayHistory[replayIndex];
  if (!step) return;

  renderBoard(step.fen, step.uci);
  $('replay-step-info').textContent = `${replayIndex} / ${replayHistory.length - 1}`;
  $('meta-moves').textContent = `${replayIndex} 步`;
  $('meta-turn').textContent = turnFromFen(step.fen) === 'white' ? '白方执子' : '黑方执子';
  $('meta-game-state').textContent = `复盘中 (${replayIndex}/${replayHistory.length - 1})`;

  // Highlight history move
  const sanList = replayHistory.slice(1).map(s => s.san);
  renderHistoryTable(sanList, replayIndex);

  $('btn-rep-start').disabled = replayIndex === 0;
  $('btn-rep-prev').disabled = replayIndex === 0;
  $('btn-rep-next').disabled = replayIndex === replayHistory.length - 1;
  $('btn-rep-end').disabled = replayIndex === replayHistory.length - 1;
}

$('btn-rep-start').onclick = () => {
  replayIndex = 0;
  updateReplayView();
};
$('btn-rep-prev').onclick = () => {
  if (replayIndex > 0) {
    replayIndex--;
    updateReplayView();
  }
};
$('btn-rep-next').onclick = () => {
  if (replayIndex < replayHistory.length - 1) {
    replayIndex++;
    updateReplayView();
  }
};
$('btn-rep-end').onclick = () => {
  replayIndex = replayHistory.length - 1;
  updateReplayView();
};
$('btn-rep-exit').onclick = exitReplayMode;

// --- History Records List ---
async function loadRecords() {
  const tbody = $('records-tbody');
  try {
    const res = await api('/api/arena/records?limit=50&offset=0');
    cachedRecords = res.records || [];

    if (cachedRecords.length === 0) {
      tbody.innerHTML = '<tr><td colspan="7" class="empty-records">暂无历史对弈记录</td></tr>';
      return;
    }

    let rowsHtml = '';
    for (const rec of cachedRecords) {
      let timeStr = '-';
      if (rec.created_at) {
        try {
          const d = new Date(rec.created_at);
          timeStr = d.toLocaleString('zh-CN', { month: '2-digit', day: '2-digit', hour: '2-digit', minute: '2-digit', second: '2-digit' });
        } catch(e) {
          timeStr = rec.created_at.slice(0, 19).replace('T', ' ');
        }
      }

      let badgeCls = 'badge-stopped';
      let resultLabel = rec.result || '*';
      if (rec.winner === 'white' || rec.result === '1-0') {
        badgeCls = 'badge-white-win';
        resultLabel = '1-0 (白胜)';
      } else if (rec.winner === 'black' || rec.result === '0-1') {
        badgeCls = 'badge-black-win';
        resultLabel = '0-1 (黑胜)';
      } else if (rec.winner === 'draw' || rec.result === '1/2-1/2') {
        badgeCls = 'badge-draw';
        resultLabel = '1/2-1/2 (和局)';
      } else {
        resultLabel = rec.winner === 'stopped' ? '已终止' : '*';
      }

      const wArg = rec.white_arg ? ` (${esc(rec.white_arg)})` : '';
      const bArg = rec.black_arg ? ` (${esc(rec.black_arg)})` : '';
      const reason = esc(rec.termination_reason || '-');

      rowsHtml += `
        <tr>
          <td><span style="font-family:monospace;font-size:12px;color:var(--text-secondary);">${esc(timeStr)}</span></td>
          <td><strong>${esc(rec.white_model)}</strong>${wArg}</td>
          <td><strong>${esc(rec.black_model)}</strong>${bArg}</td>
          <td><span class="badge-result ${badgeCls}">${esc(resultLabel)}</span></td>
          <td>${rec.ply_count || 0}</td>
          <td><span style="color:var(--text-muted);font-size:12px;">${reason}</span></td>
          <td>
            <button class="btn-secondary btn-load-replay" data-id="${esc(rec.id)}" style="font-size:11px;padding:4px 8px;">
              载入复盘
            </button>
          </td>
        </tr>
      `;
    }
    tbody.innerHTML = rowsHtml;

    // Bind replay buttons
    tbody.querySelectorAll('.btn-load-replay').forEach(btn => {
      btn.onclick = () => {
        const id = btn.getAttribute('data-id');
        const rec = cachedRecords.find(r => r.id === id);
        if (rec) {
          enterReplayMode(rec);
          window.scrollTo({ top: 0, behavior: 'smooth' });
        }
      };
    });
  } catch (err) {
    tbody.innerHTML = `<tr><td colspan="7" class="empty-records" style="color:var(--accent-red)">加载对弈记录失败: ${esc(err.message)}</td></tr>`;
  }
}

$('btn-refresh-records').onclick = loadRecords;

// --- Initialize Page ---
window.addEventListener('DOMContentLoaded', () => {
  buildBoard();
  renderBoard(START_FEN);
  loadModels();
  loadRecords();
});
</script>
