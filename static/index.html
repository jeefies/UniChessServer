<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>UniChess - 智能对弈服务</title>
<style>
  :root {
    --bg-main: #0f1117;
    --bg-card: #181b24;
    --bg-card-subtle: #212634;
    --bg-card-hover: #292f40;
    --border-subtle: rgba(255, 255, 255, 0.08);
    --border-focus: #4f6bdf;
    
    --text-primary: #f0f3f8;
    --text-secondary: #9aa3b5;
    --text-muted: #5e6678;

    --board-light: #f0d9b5;
    --board-dark: #b58863;
    --board-sel: rgba(246, 214, 60, 0.65);
    --board-last: rgba(155, 199, 0, 0.42);
    --board-check: radial-gradient(ellipse at center, rgba(235, 60, 60, 0.9) 0%, rgba(200, 20, 20, 0.6) 45%, rgba(0,0,0,0) 75%);

    --accent-green: #22c55e;
    --accent-green-hover: #16a34a;
    --accent-blue: #3b82f6;
    --accent-amber: #f59e0b;
    --accent-red: #ef4444;

    --eval-white: #ffffff;
    --eval-draw: #78716c;
    --eval-black: #1e212b;

    --sq-size: min(80px, calc((100vw - 48px - 36px) / 8));
  }

  @media (min-width: 900px) {
    :root {
      --sq-size: 72px;
    }
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    background-color: var(--bg-main);
    color: var(--text-primary);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 16px 12px;
  }

  .container {
    width: 100%;
    max-width: 1140px;
    display: flex;
    flex-direction: column;
    gap: 20px;
  }

  /* Header */
  header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 8px 4px;
    border-bottom: 1px solid var(--border-subtle);
  }
  .brand {
    display: flex;
    align-items: center;
    gap: 12px;
  }
  .logo-icon {
    width: 32px;
    height: 32px;
    background: linear-gradient(135deg, #4f46e5, #06b6d4);
    border-radius: 8px;
    display: flex;
    align-items: center;
    justify-content: center;
    box-shadow: 0 4px 12px rgba(79, 70, 229, 0.3);
  }
  .logo-icon svg { width: 20px; height: 20px; fill: #fff; }
  .brand-title {
    font-size: 20px;
    font-weight: 700;
    letter-spacing: -0.5px;
    background: linear-gradient(to right, #ffffff, #94a3b8);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
  }
  .badge-models {
    font-size: 12px;
    padding: 4px 10px;
    border-radius: 9999px;
    background: var(--bg-card);
    border: 1px solid var(--border-subtle);
    color: var(--text-secondary);
    display: flex;
    align-items: center;
    gap: 6px;
  }
  .badge-dot {
    width: 7px;
    height: 7px;
    border-radius: 50%;
    background: var(--accent-green);
    box-shadow: 0 0 8px var(--accent-green);
  }

  /* Main Workspace */
  .workspace {
    display: flex;
    flex-direction: column;
    gap: 24px;
    align-items: center;
  }

  @media (min-width: 960px) {
    .workspace {
      flex-direction: row;
      align-items: flex-start;
      justify-content: center;
      gap: 32px;
    }
  }

  /* Board Section */
  .board-section {
    display: flex;
    gap: 14px;
    user-select: none;
    touch-action: manipulation;
  }

  .eval-gauge {
    width: 14px;
    height: calc(var(--sq-size) * 8);
    background: var(--eval-black);
    border-radius: 7px;
    overflow: hidden;
    position: relative;
    border: 1px solid var(--border-subtle);
    box-shadow: inset 0 2px 4px rgba(0,0,0,0.5);
    flex-shrink: 0;
  }
  .eval-fill-white {
    position: absolute;
    bottom: 0;
    left: 0;
    right: 0;
    background: var(--eval-white);
    transition: height 0.4s cubic-bezier(0.4, 0, 0.2, 1);
  }
  .eval-fill-draw {
    position: absolute;
    left: 0;
    right: 0;
    background: var(--eval-draw);
    opacity: 0.6;
    transition: bottom 0.4s ease, height 0.4s ease;
  }

  .board-container {
    position: relative;
    border-radius: 8px;
    box-shadow: 0 16px 36px -4px rgba(0, 0, 0, 0.6), 0 0 0 1px rgba(255,255,255,0.05);
    overflow: hidden;
  }

  .chessboard {
    display: grid;
    grid-template-columns: repeat(8, var(--sq-size));
    grid-template-rows: repeat(8, var(--sq-size));
    background: var(--board-dark);
  }

  .sq {
    width: var(--sq-size);
    height: var(--sq-size);
    position: relative;
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    overflow: hidden;
  }
  .sq.l { background-color: var(--board-light); }
  .sq.d { background-color: var(--board-dark); }

  .sq.sel {
    background-color: var(--board-sel) !important;
  }
  .sq.last {
    background-color: var(--board-last) !important;
  }
  .sq.check {
    background: var(--board-check) !important;
  }

  /* Piece SVG rendering */
  .sq .piece {
    width: 88%;
    height: 88%;
    position: relative;
    z-index: 2;
    pointer-events: none;
    transition: transform 0.12s ease-out;
  }
  .sq:active .piece {
    transform: scale(0.94);
  }

  /* Move Indicators */
  .sq .dest-dot {
    position: absolute;
    width: 28%;
    height: 28%;
    border-radius: 50%;
    background: rgba(30, 41, 59, 0.4);
    backdrop-filter: blur(1px);
    z-index: 3;
    pointer-events: none;
  }
  .sq.d .dest-dot {
    background: rgba(15, 23, 42, 0.35);
  }
  .sq .dest-capture {
    position: absolute;
    inset: 7%;
    border-radius: 50%;
    border: calc(var(--sq-size) * 0.08) solid rgba(30, 41, 59, 0.38);
    z-index: 3;
    pointer-events: none;
  }

  /* Rank & File labels */
  .coord {
    position: absolute;
    font-size: 11px;
    font-weight: 700;
    pointer-events: none;
    z-index: 4;
    user-select: none;
    line-height: 1;
    opacity: 0.8;
  }
  .coord.f { right: 4px; bottom: 3px; }
  .coord.r { left: 4px; top: 3px; }
  .sq.l .coord { color: var(--board-dark); }
  .sq.d .coord { color: var(--board-light); }

  /* Promotion Overlay Modal */
  .promo-overlay {
    position: absolute;
    inset: 0;
    background: rgba(15, 17, 23, 0.82);
    backdrop-filter: blur(4px);
    z-index: 100;
    display: none;
    align-items: center;
    justify-content: center;
    flex-direction: column;
    gap: 16px;
    border-radius: 8px;
  }
  .promo-title {
    font-size: 14px;
    font-weight: 600;
    color: var(--text-primary);
  }
  .promo-choices {
    display: flex;
    gap: 12px;
    background: var(--bg-card);
    padding: 8px 12px;
    border-radius: 12px;
    border: 1px solid var(--border-subtle);
  }
  .promo-opt {
    width: 60px;
    height: 60px;
    border-radius: 8px;
    background: var(--bg-card-subtle);
    border: 1px solid var(--border-subtle);
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: all 0.15s ease;
  }
  .promo-opt:hover {
    background: var(--bg-card-hover);
    border-color: var(--accent-blue);
    transform: translateY(-2px);
  }
  .promo-opt svg {
    width: 44px;
    height: 44px;
  }

  /* Control Panel */
  .panel {
    width: 100%;
    max-width: 420px;
    background: var(--bg-card);
    border: 1px solid var(--border-subtle);
    border-radius: 14px;
    padding: 20px;
    display: flex;
    flex-direction: column;
    gap: 16px;
    box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.4);
  }

  .config-grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 12px;
  }
  .config-full {
    grid-column: 1 / -1;
  }

  .control-group {
    display: flex;
    flex-direction: column;
    gap: 6px;
  }
  .control-label {
    font-size: 11px;
    font-weight: 600;
    text-transform: uppercase;
    letter-spacing: 0.5px;
    color: var(--text-secondary);
  }

  select, input, button {
    font-family: inherit;
    font-size: 13px;
    outline: none;
    border-radius: 8px;
    border: 1px solid var(--border-subtle);
    background: var(--bg-card-subtle);
    color: var(--text-primary);
    transition: all 0.2s ease;
  }
  select {
    padding: 8px 10px;
    cursor: pointer;
  }
  select:hover {
    background: var(--bg-card-hover);
    border-color: rgba(255,255,255,0.15);
  }
  select:focus {
    border-color: var(--border-focus);
    box-shadow: 0 0 0 2px rgba(79, 107, 223, 0.25);
  }

  .action-buttons {
    display: flex;
    gap: 8px;
  }
  button {
    padding: 9px 14px;
    font-weight: 600;
    cursor: pointer;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    gap: 6px;
  }
  button:hover:not(:disabled) {
    background: var(--bg-card-hover);
    border-color: rgba(255,255,255,0.2);
  }
  button:active:not(:disabled) {
    transform: scale(0.98);
  }
  button:disabled {
    opacity: 0.4;
    cursor: not-allowed;
  }

  button.btn-primary {
    background: linear-gradient(135deg, #15803d, #16a34a);
    border: 1px solid #22c55e;
    color: #ffffff;
    box-shadow: 0 4px 14px rgba(22, 163, 74, 0.3);
    flex: 1.4;
  }
  button.btn-primary:hover:not(:disabled) {
    background: linear-gradient(135deg, #16a34a, #22c55e);
  }

  button.btn-secondary {
    flex: 1;
    background: var(--bg-card-subtle);
  }

  /* Status Card */
  .status-box {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 12px 14px;
    border-radius: 8px;
    background: var(--bg-card-subtle);
    border: 1px solid var(--border-subtle);
    min-height: 48px;
  }
  .status-indicator {
    width: 8px;
    height: 8px;
    border-radius: 50%;
    background: var(--accent-green);
    flex-shrink: 0;
  }
  .status-box.thinking .status-indicator {
    background: var(--accent-amber);
    box-shadow: 0 0 10px var(--accent-amber);
    animation: pulse 1s infinite alternate;
  }
  .status-box.gameover .status-indicator {
    background: var(--accent-red);
  }
  .status-box.error .status-indicator {
    background: var(--accent-red);
    box-shadow: 0 0 8px var(--accent-red);
  }
  .status-text {
    font-size: 13px;
    line-height: 1.4;
    color: var(--text-primary);
  }
  .status-box.error .status-text {
    color: #fca5a5;
  }

  @keyframes pulse {
    0% { opacity: 0.4; transform: scale(0.9); }
    100% { opacity: 1; transform: scale(1.15); }
  }

  /* WDL Stats */
  .wdl-container {
    display: flex;
    flex-direction: column;
    gap: 6px;
    background: var(--bg-card-subtle);
    padding: 10px 12px;
    border-radius: 8px;
    border: 1px solid var(--border-subtle);
  }
  .wdl-bar {
    display: flex;
    height: 8px;
    border-radius: 4px;
    overflow: hidden;
    background: #0f1117;
  }
  .wdl-bar-item {
    height: 100%;
    transition: width 0.3s ease;
  }
  .wdl-bar-w { background: var(--eval-white); }
  .wdl-bar-d { background: var(--eval-draw); }
  .wdl-bar-l { background: var(--eval-black); border-right: 1px solid var(--border-subtle); }

  .wdl-labels {
    display: flex;
    justify-content: space-between;
    font-size: 11px;
    font-weight: 500;
    color: var(--text-secondary);
  }

  /* Metadata Details */
  .meta-grid {
    display: grid;
    grid-template-columns: repeat(2, 1fr);
    gap: 8px;
    background: var(--bg-card-subtle);
    padding: 10px 12px;
    border-radius: 8px;
    border: 1px solid var(--border-subtle);
    font-size: 12px;
  }
  .meta-item {
    display: flex;
    justify-content: space-between;
    color: var(--text-muted);
  }
  .meta-val {
    color: var(--text-primary);
    font-weight: 500;
  }

  /* Move History Table */
  .history-box {
    display: flex;
    flex-direction: column;
    height: 160px;
    background: var(--bg-card-subtle);
    border-radius: 8px;
    border: 1px solid var(--border-subtle);
    overflow: hidden;
  }
  .history-header {
    padding: 6px 12px;
    font-size: 11px;
    font-weight: 600;
    text-transform: uppercase;
    color: var(--text-secondary);
    background: rgba(0,0,0,0.15);
    border-bottom: 1px solid var(--border-subtle);
  }
  .history-list {
    flex: 1;
    overflow-y: auto;
    padding: 6px 8px;
    font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
    font-size: 12px;
    display: flex;
    flex-direction: column;
    gap: 2px;
  }
  .history-row {
    display: grid;
    grid-template-columns: 36px 1fr 1fr;
    padding: 2px 4px;
    border-radius: 4px;
  }
  .history-row:hover {
    background: rgba(255,255,255,0.03);
  }
  .history-num { color: var(--text-muted); }
  .history-move { color: var(--text-primary); cursor: pointer; }
</style>
</head>

      <path d="M12 28c4-1 16-1 20 0v4H12v-4zm-1 5h22v4H11v-4z" fill="#1e212b" stroke="#fff" stroke-width="1.5"/>

<script>
const FILES = 'abcdefgh';
let S = { fen: '8/8/8/8/8/8/8/8 w - - 0 1', legal_moves: [], is_game_over: false, engine_white: true, in_check: false, last_move: null, eval: null, san_history: [], source: null, engine_ms: null };
let sel = null;        // 已选中的起点格
let flipped = false;   // 棋盘是否翻转
let busy = false;
let boardCells = null;
let boardFlipped = null;
let pendingPromo = null; // 待处理的升变走法候选

const $ = id => document.getElementById(id);
const esc = v => String(v == null ? '' : v).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

let modelsData = null;
let sessionId = null;

function onModelChange() {
  const model = $('model-select').value;
  const info = (modelsData && modelsData[model]) || null;
  const presets = (info && info.presets) || [];
  const selEl = $('preset-select');
  selEl.innerHTML = presets.length
    ? presets.map(p => `<option value="${esc(p)}">${esc(p)}</option>`).join('')
    : '<option value="">（默认参数）</option>';
}
$('model-select').onchange = onModelChange;

function updateNetInfo() {
  if (!modelsData) return;
  const names = Object.keys(modelsData);
  const avail = names.filter(n => modelsData[n] && modelsData[n].status === 'available');
  $('netinfo-text').textContent = avail.length
    ? `已连接 (${avail.join(', ')})`
    : '暂无可用模型';

  $('model-select').innerHTML = names.length
    ? names.map(n => {
        const info = modelsData[n] || {};
        const ok = info.status === 'available';
        const label = ok ? esc(n) : `${esc(n)} (未就绪)`;
        return `<option value="${esc(n)}"${ok ? '' : ' disabled'}>${label}</option>`;
      }).join('')
    : '<option value="">无模型</option>';
  onModelChange();
}

function turnFromFen(fen) {
  return fen.split(' ')[1] === 'w' ? 'white' : 'black';
}

function fenToBoard(fen) {
  const rows = fen.split(' ')[0].split('/');
  const b = {};
  rows.forEach((row, ri) => {
    let fi = 0;
    for (const ch of row) {
      if (/\d/.test(ch)) { fi += +ch; }
      else { b[FILES[fi] + (8 - ri)] = ch; fi++; }
    }
  });
  return b;
}

function buildBoard() {
  const board = $('board');
  board.innerHTML = '';
  boardCells = [];
  const ranks = flipped ? [1,2,3,4,5,6,7,8] : [8,7,6,5,4,3,2,1];
  const files = flipped ? [7,6,5,4,3,2,1,0] : [0,1,2,3,4,5,6,7];
  for (const r of ranks) {
    for (const f of files) {
      const el = document.createElement('div');
      const base = 'sq ' + (((f + r) % 2) ? 'l' : 'd');
      el.className = base;
      const sq = FILES[f] + r;
      el.onclick = () => onSquare(sq);
      board.appendChild(el);
      boardCells.push({el, sq, f, r, base});
    }
  }
  boardFlipped = flipped;
}

function render() {
  if (!S) return;
  if (!boardCells || boardFlipped !== flipped) buildBoard();
  const pieces = fenToBoard(S.fen);

  const targets = new Set();
  const captures = new Set();
  const legal = S.legal_moves || [];
  if (sel) {
    for (const u of legal) {
      if (u.slice(0, 2) === sel) {
        const toSq = u.slice(2, 4);
        targets.add(toSq);
        if (pieces[toSq]) captures.add(toSq);
      }
    }
  }

  let checkSq = null;
  if (S.in_check) {
    const turn = turnFromFen(S.fen);
    const kc = turn === 'white' ? 'K' : 'k';
    for (const [sq, p] of Object.entries(pieces)) {
      if (p === kc) checkSq = sq;
    }
  }

  for (const {el, sq, f, r, base} of boardCells) {
    let cls = base;
    if (sq === sel) cls += ' sel';
    else if (S.last_move && (S.last_move.slice(0, 2) === sq || S.last_move.slice(2, 4) === sq)) {
      cls += ' last';
    }
    if (sq === checkSq) cls += ' check';
    el.className = cls;
    el.textContent = '';

    const p = pieces[sq];
    if (p) {
      const svg = document.createElementNS('http://www.w3.org/2000/svg', 'svg');
      svg.setAttribute('class', 'piece');
      svg.setAttribute('viewBox', '0 0 45 45');
      const use = document.createElementNS('http://www.w3.org/2000/svg', 'use');
      use.setAttributeNS('http://www.w3.org/1999/xlink', 'href', '#P-' + p);
      svg.appendChild(use);
      el.appendChild(svg);
    }

    if (targets.has(sq)) {
      const marker = document.createElement('div');
      marker.className = captures.has(sq) ? 'dest-capture' : 'dest-dot';
      el.appendChild(marker);
    }

    if (r === (flipped ? 8 : 1)) {
      const c = document.createElement('div'); c.className = 'coord f'; c.textContent = FILES[f];
      el.appendChild(c);
    }
    if (f === (flipped ? 7 : 0)) {
      const c = document.createElement('div'); c.className = 'coord r'; c.textContent = r;
      el.appendChild(c);
    }
  }
  renderPanel();
}

function renderPanel() {
  const turn = turnFromFen(S.fen);

  // Moves list
  const mvEl = $('moves');
  const san = Array.isArray(S.san_history) ? S.san_history : [];
  if (san.length > 0) {
    let html = '';
    for (let i = 0; i < san.length; i += 2) {
      const round = Math.floor(i / 2) + 1;
      const w = esc(san[i] || '');
      const b = esc(san[i + 1] || '');
      html += `<div class="history-row"><span class="history-num">${round}.</span><span class="history-move">${w}</span><span class="history-move">${b}</span></div>`;
    }
    mvEl.innerHTML = html;
    mvEl.scrollTop = mvEl.scrollHeight;
  } else {
    mvEl.innerHTML = '<div style="color:var(--text-muted);padding:8px 4px;">尚无对局着法</div>';
  }

  // WDL stats
  const e = S.eval;
  if (e && typeof e.win === 'number') {
    let w = e.win, d = e.draw, l = e.loss;
    if (e.pov !== 'white' && !S.engine_white) {
      const t = w; w = l; l = t;
    }
    $('wdl-box').style.display = 'flex';
    $('wdlw').style.width = (w * 100) + '%';
    $('wdld').style.width = (d * 100) + '%';
    $('wdll').style.width = (l * 100) + '%';
    $('wdlnum').innerHTML = `<span>白胜 ${(w * 100).toFixed(0)}%</span><span>和局 ${(d * 100).toFixed(0)}%</span><span>黑胜 ${(l * 100).toFixed(0)}%</span>`;

    const score = w + d / 2;
    $('evalfill').style.height = (score * 100) + '%';
    $('evaldraw').style.bottom = (w * 100) + '%';
    $('evaldraw').style.height = (d * 100) + '%';
  } else {
    $('wdl-box').style.display = 'none';
    $('evalfill').style.height = '50%';
    $('evaldraw').style.height = '0%';
  }

  // Metadata
  $('meta-model').textContent = $('model-select').value || '-';
  $('meta-turn').textContent = turn === 'white' ? '白方' : '黑方';
  $('meta-engine-side').textContent = S.engine_white ? 'AI 执白' : 'AI 执黑';
  $('meta-moves').textContent = san.length ? `${Math.ceil(san.length / 2)} 回合 (${san.length} 步)` : '0';

  if (S.source) {
    $('meta-source-row').style.display = 'flex';
    $('meta-source').textContent = S.source;
  } else {
    $('meta-source-row').style.display = 'none';
  }

  if (S.engine_ms != null) {
    $('meta-time-row').style.display = 'flex';
    $('meta-time').textContent = `${S.engine_ms} ms`;
  } else {
    $('meta-time-row').style.display = 'none';
  }
}

function setStatus(text, type = '') {
  const card = $('status-card');
  const label = $('status');
  label.textContent = text;
  card.className = 'status-box' + (type ? ' ' + type : '');
}

async function api(path, method, body) {
  const r = await fetch(path, {
    method,
    headers: {'Content-Type': 'application/json'},
    body: body ? JSON.stringify(body) : undefined
  });
  if (!r.ok) {
    let msg = r.statusText;
    try {
      const d = (await r.json()).detail;
      if (Array.isArray(d) && d.length) {
        msg = d.map(e => (e.loc ? e.loc.join('.') + ': ' : '') + (e.msg || '')).join('; ');
      } else if (d) {
        msg = d;
      }
    } catch(e) {}
    throw new Error(msg);
  }
  return r.json();
}

function afterState() {
  sel = null;
  render();
  if (S.is_game_over) {
    setStatus('对局结束。', 'gameover');
  } else {
    const turn = turnFromFen(S.fen);
    const mine = (turn === 'white') === !S.engine_white;
    setStatus(mine ? '轮到你走棋，请选择棋子与目标格。' : 'AI 正在深度思考中...', mine ? '' : 'thinking');
  }
}

function myTurn() {
  if (!S) return false;
  const turn = turnFromFen(S.fen);
  return (turn === 'white') === !S.engine_white;
}

function showPromotionDialog(candidates, isWhite) {
  const overlay = $('promo-overlay');
  const choicesEl = $('promo-choices');
  choicesEl.innerHTML = '';
  const pieces = isWhite ? ['Q', 'R', 'B', 'N'] : ['q', 'r', 'b', 'n'];

  pieces.forEach(p => {
    const opt = document.createElement('div');
    opt.className = 'promo-opt';
    opt.innerHTML = `<svg viewBox="0 0 45 45"><use href="#P-${p}"/></svg>`;
    opt.onclick = () => {
      overlay.style.display = 'none';
      const pickChar = p.toLowerCase();
      const match = candidates.find(u => u.endsWith(pickChar));
      if (match) executeMove(match);
    };
    choicesEl.appendChild(opt);
  });
  overlay.style.display = 'flex';
}

function applyUciToFen(fen, uci) {
  const fromSq = uci.slice(0, 2);
  const toSq = uci.slice(2, 4);
  const promo = uci.length > 4 ? uci[4] : null;

  const parts = fen.split(' ');
  const boardRows = parts[0].split('/');
  const b = fenToBoard(fen);
  const movingPiece = b[fromSq];
  if (!movingPiece) return fen;

  delete b[fromSq];
  if (promo) {
    b[toSq] = (movingPiece === movingPiece.toUpperCase()) ? promo.toUpperCase() : promo.toLowerCase();
  } else {
    // 易位：移动对应的车
    if (movingPiece === 'K' && fromSq === 'e1') {
      if (toSq === 'g1') { delete b['h1']; b['f1'] = 'R'; }
      else if (toSq === 'c1') { delete b['a1']; b['d1'] = 'R'; }
    } else if (movingPiece === 'k' && fromSq === 'e8') {
      if (toSq === 'g8') { delete b['h8']; b['f8'] = 'r'; }
      else if (toSq === 'c8') { delete b['a8']; b['d8'] = 'r'; }
    }
    // 吃过路兵
    if (movingPiece.toLowerCase() === 'p' && fromSq[0] !== toSq[0] && !b[toSq]) {
      const epSq = toSq[0] + fromSq[1];
      delete b[epSq];
    }
    b[toSq] = movingPiece;
  }

  // 重构 FEN 棋子段
  const newRows = [];
  for (let r = 8; r >= 1; r--) {
    let empty = 0;
    let rowStr = '';
    for (let f = 0; f < 8; f++) {
      const sq = FILES[f] + r;
      const p = b[sq];
      if (p) {
        if (empty > 0) { rowStr += empty; empty = 0; }
        rowStr += p;
      } else {
        empty++;
      }
    }
    if (empty > 0) rowStr += empty;
    newRows.push(rowStr);
  }

  const nextTurn = parts[1] === 'w' ? 'b' : 'w';
  return `${newRows.join('/')} ${nextTurn} - - 0 1`;
}

async function executeMove(uci) {
  busy = true;
  sel = null;

  // 乐观更新：立刻在前端应用人类走子动画与棋盘更新
  const prevS = JSON.parse(JSON.stringify(S));
  try {
    const nextFen = applyUciToFen(S.fen, uci);
    S.fen = nextFen;
    S.last_move = uci;
    S.legal_moves = []; // 人类落子后等待引擎响应，禁止再走
    setStatus('AI 思考中...', 'thinking');
    render();
  } catch(e) {
    // 乐观更新若解析异常，忽略并交由后端处理
  }

  try {
    const resp = await api(`/api/games/${sessionId}/move`, 'POST', {uci});
    S = resp.state;
    afterState();
  } catch(e) {
    S = prevS;
    setStatus('走法错误：' + e.message, 'error');
    render();
  } finally {
    busy = false;
  }
}

async function onSquare(sq) {
  if (busy || !S || S.is_game_over || !myTurn()) return;

  const legal = S.legal_moves || [];
  if (sel === null) {
    if (legal.some(u => u.slice(0, 2) === sq)) {
      sel = sq;
      render();
    }
    return;
  }
  if (sel === sq) {
    sel = null;
    render();
    return;
  }

  const cands = legal.filter(u => u.slice(0, 2) === sel && u.slice(2, 4) === sq);
  if (cands.length === 0) {
    if (legal.some(u => u.slice(0, 2) === sq)) {
      sel = sq;
      render();
    } else {
      sel = null;
      render();
    }
    return;
  }

  if (cands.length > 1) {
    // 升变弹窗
    const isWhite = turnFromFen(S.fen) === 'white';
    showPromotionDialog(cands, isWhite);
    return;
  }

  executeMove(cands[0]);
}

$('newgame').onclick = async () => {
  if (busy) return;
  const model = $('model-select').value;
  const info = modelsData && modelsData[model];
  if (!info || info.status !== 'available') {
    setStatus(`所选引擎 ${model || ''} 暂不可用`, 'error');
    return;
  }
  busy = true;
  setStatus('正在初始化对局...', 'thinking');
  try {
    const engineWhite = $('side').value === 'white';
    const argName = $('preset-select').value || null;
    flipped = engineWhite;
    const resp = await api('/api/new', 'POST', {
      model_name: model,
      arg_name: argName,
      engine_white: engineWhite
    });
    sessionId = resp.session_id;
    S = resp.state;
    afterState();
  } catch(e) {
    setStatus('开局失败：' + e.message, 'error');
  } finally {
    busy = false;
  }
};

$('undo').onclick = async () => {
  if (!S || !sessionId || busy) return;
  busy = true;
  try {
    const resp = await api(`/api/games/${sessionId}/undo`, 'POST');
    S = resp.state;
    afterState();
  } catch(e) {
    setStatus('悔棋失败：' + e.message, 'error');
  } finally {
    busy = false;
  }
};

$('flip').onclick = () => {
  flipped = !flipped;
  render();
};

(async () => {
  try {
    const resp = await api('/api/models', 'GET');
    modelsData = resp.models;
    updateNetInfo();
  } catch(e) {
    $('netinfo-text').textContent = '后端未就绪';
    setStatus('连接对弈服务失败，请检查服务状态', 'error');
  }
})();
render();
</script>
